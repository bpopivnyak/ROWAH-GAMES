<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROWAH-GAMES Cart Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/cart.css">

<body>

    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-logo" href="index.html">ROWAH-GAMES</a>
            <a href="cart.html" type="button" class="btn btn-danger">
                <i class="bi bi-cart"></i>
                Cart</a>
        </div>
    </nav>

    <header>
        <h1>Cart Order</h1>
    </header>

    <main class="container text-white">
        <div id="cartItems">

        </div>
        <form action="" method="post">
            <h2>Confirmation order</h2>
            <div class="row g-3">
                <div class="col">
                    <input type="text" class="form-control" placeholder="First name" aria-label="First name">
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
                </div>
            </div>
            <div class="row g-3 my-3">
                <div class="col">
                    <input type="email" class="form-control" placeholder="Email" aria-label="Email">
                </div>
                <div class="col">
                    <input type="telephone" class="form-control" placeholder="Your Phone" aria-label="Your phone">
                </div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Confirm</button>
            </div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>

</html>
